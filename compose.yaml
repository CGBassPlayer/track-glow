services:
  track-glow:
    build: .
    image: track-glow
    # Host networking: DDP to LAN WLED controllers and *.local names need the host network.
    network_mode: host
    volumes:
      # Named volume: Docker seeds it from the image's /config, owned by the container user.
      - config:/config
    restart: unless-stopped

volumes:
  config:
